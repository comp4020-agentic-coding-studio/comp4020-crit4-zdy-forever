<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Two Hands — a browser instrument</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1 class="invitation">MOVE. PRESS. PLAY.</h1>

      <div class="toolbar">
        <div class="instrument-select" role="group" aria-label="Instrument">
          <button type="button" class="pill" data-instrument="piano" aria-pressed="true">
            PIANO
          </button>
          <button type="button" class="pill" data-instrument="violin" aria-pressed="false">
            VIOLIN
          </button>
        </div>
        <button type="button" class="pill camera-button" id="camera-toggle" aria-pressed="false">
          Enable Camera
        </button>
      </div>

      <p class="camera-status" id="camera-status" role="status" aria-live="polite"></p>

      <div class="stage" id="stage">
        <div class="camera-layer" id="camera-layer" aria-hidden="true"></div>
        <div class="wheels" id="wheels"></div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
